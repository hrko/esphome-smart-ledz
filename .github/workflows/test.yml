name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: esphome-smart-ledz
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hrko/esp-telink-mesh
          ref: bf289fc21f58f15e9c40e2ed82639a99d2185aff
          path: esp-telink-mesh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hrko/smartledz-protocol
          ref: f70f4a028ce70769bd670deecdb663f549905550
          path: smartledz-protocol
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.3
          working_directory: esphome-smart-ledz
      - name: Install host crypto test dependency
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Host regression tests
        working-directory: esphome-smart-ledz
        run: |
          bash ../esp-telink-mesh/tests/run.sh
          bash ../smartledz-protocol/tests/run.sh
          mise run test
      - name: YAML export regression tests
        working-directory: esphome-smart-ledz
        run: node tests/export_yaml_test.cjs
      - name: Lint and type check
        working-directory: esphome-smart-ledz
        run: |
          mise run lint
          uv run --locked python tests/turn_on_config_test.py
      - name: Compile ESP32-S3 firmware and analyze C++
        working-directory: esphome-smart-ledz
        run: mise run cpp-check
