name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: esphome-smart-ledz
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hrko/esp-telink-mesh
          ref: 642c5cf65426f2db73f14fb6f93d7a81b8076a55
          path: esp-telink-mesh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hrko/smartledz-protocol
          ref: 5d234fcfa97b45bcb9d7200ebfa82561259af1db
          path: smartledz-protocol
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          working_directory: esphome-smart-ledz
      - name: Host regression tests
        working-directory: esphome-smart-ledz
        run: |
          bash ../esp-telink-mesh/tests/run.sh
          mise run test
      - name: Lint and type check
        working-directory: esphome-smart-ledz
        run: mise run lint
      - name: Compile ESP32-S3 firmware
        working-directory: esphome-smart-ledz
        run: mise run esphome-compile
