[settings]
experimental = true
lockfile = true

[tools]
python = "3.15.0"
uv = "0.13.0"

[tasks.esphome-compile]
description = "Compile Smart LEDZ test YAML (local external component, no secrets)"
env = { PLATFORMIO_CORE_DIR = ".platformio-local" }
run = "uv run --locked esphome compile compile_test.yaml"

[tasks.test]
description = "Run host C++ regression tests (requires g++ and sibling libraries)"
run = "bash tests/run.sh"

[tasks.lint]
description = "Run Python lint/type checks for the external component"
run = """
uv run --locked ruff check components tools
uv run --locked ty check --project . --python .venv --extra-search-path components components tools
"""
